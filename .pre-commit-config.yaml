repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        entry: cargo +nightly-2026-04-11 fmt
      - id: clippy
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 09faadcea2d0d1742492e6872b743d1e4d151a27 # 0.19.0
    hooks:
      - id: cargo-deny
        args:
          - check
          - --hide-inclusion-graph
          - -c
          - .cargo-deny.toml
          - --show-stats
          - --deny
          - warnings
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3 # Can't update until: https://github.com/tamasfe/taplo/issues/805
    hooks:
      - id: taplo-format
      - id: taplo-lint
